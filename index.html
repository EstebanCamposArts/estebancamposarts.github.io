<head>
  <meta charset="UTF-8" />

  <title>Portfolio - Pentagram Style</title>
  <link rel="stylesheet" href="styles/styles.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: Helvetica, Arial, sans-serif;
    }
    .horizontal-scroll {
      display: flex;
      flex-direction: row;
      height: 100vh;
      width: 100%;
      overflow-x: scroll;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
    }
    section {
      flex: 0 0 100vw;
      height: 100vh;
      scroll-snap-align: start;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    nav {
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 100;
    }
    nav a {
      display: block;
      margin-bottom: 0.5rem;
      text-decoration: none;
      color: #111;
      font-weight: bold;
    }
  </style>
</head>
