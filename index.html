<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esteban Campos Polo | Graphic Designer & 3D Artist</title>
  <link rel="stylesheet" href="styles/styles.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #000;
      color: white;
    }
    header {
      padding: 1.5rem 0 0.5rem;
      text-align: center;
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 1px;
      background-color: #000;
    }
    nav {
      display: none;
    }
    section {
      padding: 2rem 1rem;
    }
    h2 {
      margin-bottom: 1rem;
      font-size: 1rem;
      font-weight: bold;
      text-transform: uppercase;
      color: white;
    }
    h3 {
      margin: 0.5rem 0;
      font-size: 0.9rem;
      font-weight: normal;
    }
    .scroll-gallery {
      display: flex;
      overflow-x: auto;
      gap: 1rem;
      padding: 0.5rem 0;
      scroll-snap-type: x mandatory;
    }
    .scroll-gallery img {
      height: 180px;
      flex: 0 0 auto;
      object-fit: contain;
      background: white;
      padding: 0.5rem;
      scroll-snap-align: start;
    }
    .video-highlight {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .video-highlight video {
      width: 60%;
      max-width: 800px;
      border: 2px solid white;
    }
    .downloads {
      margin-top: 1rem;
      text-align: center;
    }
    .downloads a {
      color: white;
      text-decoration: underline;
      margin: 0 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    ESTEBAN CAMPOS POLO | DISEÑADOR GRAFICO & MODELADOR 3D
  </header>

  <section id="about">
    <div class="downloads">
      <a href="assets/Curriculum.pdf" download>Download CV (ES)</a>
      <a href="assets/Resume.pdf" download>Download CV (EN)</a>
    </div>
  </section>

  <section id="3d-video">
    <div class="video-highlight">
      <video controls>
        <source src="assets/video/demoportfolio.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </section>

  <section id="graphic-design">
    <h2>GRAPHIC DESIGN</h2>
    <h3>Branding & Identity</h3>
    <div class="scroll-gallery">
      <img src="assets/images/logotipos/casinojavea.jpg" alt="Logo 1">
      <img src="assets/images/logotipos/saborsfish.jpg" alt="Logo 2">
      <img src="assets/images/logotipos/pleurotus.jpg" alt="Logo 3">
      <img src="assets/images/logotipos/confiteria.jpg" alt="Logo 4">
      <img src="assets/images/logotipos/merlot.jpg" alt="Logo 5">
      <img src="assets/images/logotipos/apicola.jpg" alt="Logo 6">
      <img src="assets/images/logotipos/crea.jpg" alt="Logo 7">
    </div>
    <h3>Posters / Advertising</h3>
    <div class="scroll-gallery">
      <img src="assets/images/graphicdesign/cartel DESBORDAOS guerre_Mesa de trabajo 1.jpg" alt="Desbordados 1">
      <img src="assets/images/graphicdesign/cartel DESBORDAOS guerre_Mesa de trabajo 2.jpg" alt="Desbordados 2">
    </div>
  </section>

  <section id="photography">
    <h2>PHOTOGRAPHY</h2>
    <h3>Sports</h3>
    <div class="scroll-gallery">
      <img src="assets/images/fotografia/sports/pilota/jpg/pilota_1.jpg" alt="Pilota 1">
      <img src="assets/images/fotografia/sports/pilota/jpg/pilota_2.jpg" alt="Pilota 2">
      <img src="assets/images/fotografia/sports/pilota/jpg/pilota_3.jpg" alt="Pilota 3">
      <img src="assets/images/fotografia/sports/pilota/jpg/pilota_4.jpg" alt="Pilota 4">
      <img src="assets/images/fotografia/sports/pilota/jpg/pilota_5.jpg" alt="Pilota 5">
      <img src="assets/images/fotografia/sports/pilota/jpg/pilota_6.jpg" alt="Pilota 6">
    </div>
  </section>

  <section id="3d-art">
    <h2>3D ART</h2>
    <div class="scroll-gallery">
      <img src="assets/images/3dmodeling/machine.jpg" alt="Machine">
      <img src="assets/images/3dmodeling/rob/rob_1.jpg" alt="Rob 1">
      <img src="assets/images/3dmodeling/rob/rob_2.jpg" alt="Rob 2">
      <img src="assets/images/3dmodeling/rob/rob_3.jpg" alt="Rob 3">
      <img src="assets/images/3dmodeling/rob/rob_4.jpg" alt="Rob 4">
      <img src="assets/images/3dmodeling/rob/rob_5.jpg" alt="Rob 5">
    </div>
  </section>
</body>
</html>
