<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Esteban Campos Polo</title>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8VMES8F4MN"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-8VMES8F4MN', {
      anonymize_ip: true,
      allow_google_signals: false,
      send_page_view: true
    });

    /* Tracking de clics en redes o mail */
    document.addEventListener('click', function(e){
      const externalLink = e.target.closest('a[href^="mailto:"], a[target="_blank"]');
      if(externalLink){
        gtag('event', 'contact_interaction', {
          link_url: externalLink.href,
          page_location: window.location.href
        });
      }
    }, { passive: true });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --text: #f5f5f5;
      --muted: #9a9a9a;
      --border: rgba(255, 255, 255, 0.08);
      --transition: all 0.6s cubic-bezier(.19,1,.22,1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.015;
      background-image: url('https://grainy-gradients.vercel.app/noise.svg');
      z-index: 9999;
    }

    /* Cabecera unificada */
    .main-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 48px;
      backdrop-filter: blur(10px);
      background: rgba(10, 10, 10, 0.75);
      border-bottom: 1px solid var(--border);
    }
    .logo-block { display: flex; flex-direction: column; text-decoration: none; }
    .logo-name { font-size: 0.8rem; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text); }
    .logo-role { color: var(--muted); font-size: 0.65rem; letter-spacing: 0.12em; margin-top: 3px; text-transform: uppercase; }
    
    nav { display: flex; align-items: center; gap: 24px; }
    nav a {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      font-weight: 700;
      transition: opacity 0.3s ease;
      opacity: 0.6;
    }
    nav a:hover, nav a.active { opacity: 1; }

    .lang-switch {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
      border-radius: 4px;
      transition: var(--transition);
    }
    .lang-switch:hover { background: var(--text); color: var(--bg); border-color: var(--text); }

    /* Contenedor de Contacto */
    .contact-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 200px 8% 120px 8%;
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hero-title {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 24px;
    }

    .hero-subtitle {
      font-size: 1.2rem;
      color: var(--muted);
      font-weight: 300;
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 64px;
    }

    .email-link {
      font-size: clamp(1.2rem, 3.5vw, 2.5rem);
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.01em;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
      display: inline-block;
      transition: var(--transition);
      width: fit-content;
    }
    .email-link:hover {
      border-color: var(--text);
      color: #ffffff;
    }

    .social-grid {
      display: flex;
      gap: 32px;
      margin-top: 48px;
    }
    .social-item {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }
    .social-item:hover { color: var(--text); }

    footer {
      padding: 40px 8%;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 768px) {
      .main-header { padding: 16px 24px; flex-direction: column; gap: 12px; text-align: center; }
      nav { flex-wrap: wrap; justify-content: center; gap: 12px; }
      .contact-container { padding-top: 220px; text-align: center; }
      .hero-subtitle { margin-left: auto; margin-right: auto; }
      .email-link { margin: 0 auto; font-size: 1.1rem; }
      .social-grid { justify-content: center; flex-wrap: wrap; gap: 16px; }
    }
  </style>
</head>

<body>

  <div class="noise"></div>

  <header class="main-header">
    <a href="index.html" class="logo-block">
      <span class="logo-name">Esteban Campos Polo</span>
      <span class="logo-role">Character Modeler & Visual Designer</span>
    </a>
    <nav>
      <a href="index.html">HOME</a>
      <a href="graphic-design.html" class="nav-link" data-key="nav-gd">GRAPHIC DESIGN</a>
      <a href="3d-modeling.html" class="nav-link" data-key="nav-3d">3D</a>
      <a href="about.html" class="nav-link" data-key="nav-ab">ABOUT</a>
      <a href="cv_resume.html" class="nav-link" data-key="nav-cv">CV / RESUME</a>
      <a href="contact.html" class="active">CONTACT</a>
      <button class="lang-switch" onclick="toggleLang()" id="langBtn">ENGLISH</button>
    </nav>
  </header>

  <main class="contact-container" id="contact-content"></main>

  <footer>
    &copy; 2026 Esteban Campos Polo | Senior Profile
  </footer>

  <script>
    let currentLang = 'es';

    const translations = {
      es: {
        navGd: "GRAPHIC DESIGN",
        navPh: "PHOTOGRAPHY",
        nav3d: "3D ART",
        navAb: "ABOUT",
        navCv: "CV / RESUME",
        title: "Contacto",
        subtitle: "¿Tienes un proyecto en mente, una oferta de colaboración o buscas integrar un perfil técnico senior en tu equipo? Hablemos.",
        footerText: "Responderé lo antes posible."
      },
      en: {
        navGd: "GRAPHIC DESIGN",
        navPh: "PHOTOGRAPHY",
        nav3d: "3D ART",
        navAb: "ABOUT",
        navCv: "CV / RESUME",
        title: "Contact",
        subtitle: "Have a project in mind, a collaboration proposal, or looking to add a senior technical profile to your team? Let's talk.",
        footerText: "I will get back to you as soon as possible."
      }
    };

    function renderContact() {
      const t = translations[currentLang];
      
      document.querySelectorAll('.nav-link').forEach(link => {
        const key = link.getAttribute('data-key');
        if(t[key]) link.innerText = t[key];
      });
      document.getElementById('langBtn').innerText = currentLang === 'es' ? 'ENGLISH' : 'ESPAÑOL';

      const content = `
        <h1 class="hero-title">${t.title}</h1>
        <p class="hero-subtitle">${t.subtitle}</p>
        
        <a href="mailto:estebancampospolo@gmail.com" class="email-link">
          estebancampospolo@gmail.com
        </a>

        <div class="social-grid">
          <a href="https://linkedin.com/in/esteban-campos-polo-09852771" target="_blank" class="social-item">LinkedIn</a>
          <a href="https://estebancampos1.artstation.com" target="_blank" class="social-item">ArtStation</a>
          <a href="https://instagram.com/estebancampos3D" target="_blank" class="social-item">Instagram</a>
        </div>
        
        <p style="color: var(--muted); font-size: 0.85rem; font-weight: 300; margin-top: 40px;">
          ${t.footerText}
        </p>
      `;
      
      document.getElementById('contact-content').innerHTML = content;
    }

    function toggleLang() {
      currentLang = currentLang === 'es' ? 'en' : 'es';
      renderContact();
    }

    window.onload = renderContact;
  </script>
</body>
</html>
