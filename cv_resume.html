window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());

/* ==========================
   CONFIG BASE
========================== */
gtag('config', 'G-8VMES8F4MN', {
  anonymize_ip: true,
  allow_google_signals: false,
  send_page_view: true
});

/* ==========================
   FUNCIÓN UTILIDAD
========================== */
function getCategory(element){
  const section = element.closest('section');
  return section ? section.id : 'resume_general';
}

/* ==========================
   TRACKING UNIFICADO
========================== */
document.addEventListener('click', function(e){

  /* ---------- DESCARGAS DE CV (Métrica de Éxito) ---------- */
  const downloadLink = e.target.closest('a[href$=".pdf"], a[href$=".zip"]');
  if(downloadLink){
    const fileName = downloadLink.getAttribute('href').split('/').pop();
    // Detectamos idioma por nombre de archivo para tu reporte
    const lang = fileName.toLowerCase().includes('resume') ? 'EN' : 'ES';

    gtag('event', 'cv_download', {
      file_name: fileName,
      cv_language: lang,
      link_url: downloadLink.href,
      page_location: window.location.href
    });
    return;
  }

  /* ---------- CLICK EN EXPERIENCIA / EDUCACIÓN ---------- */
  const resumeItem = e.target.closest('.experience-item, .education-item, section');
  if(resumeItem){
    const title = resumeItem.querySelector('h3, h4');
    const itemName = title ? title.innerText.trim() : 'resume_section';
    
    gtag('event', 'resume_interaction', {
      section_name: itemName,
      section_category: getCategory(resumeItem),
      page_location: window.location.href
    });
  }

  /* ---------- CLICK REDES / CONTACTO ---------- */
  const externalLink = e.target.closest('a[target="_blank"]');
  if(externalLink){
    gtag('event', 'external_click', {
      link_url: externalLink.href,
      page_location: window.location.href
    });
  }
}, { passive: true });

/* ==========================
   SCROLL 50% (Lectura completa del CV)
========================= */
let scrollSent = false;
window.addEventListener('scroll', function(){
  if(scrollSent) return;
  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  if(docHeight <= 0) return;
  const scrollPercent = scrollTop / docHeight;
  if(scrollPercent >= 0.5){
    scrollSent = true;
    gtag('event', 'scroll_50_percent', {
      page_location: window.location.href
    });
  }
}, { passive: true });
